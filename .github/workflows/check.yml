name: Check

on:
  push:
  pull_request:
  # The candidate-validation entrypoint (#157): a manual dispatch runs this whole
  # gate on one commit and adds the authenticated npm dry-run in the build job below
  # (spec #137 stories 85/89, ADR 0027). Validation reuses the gate rather than
  # duplicating it into a second workflow, and publishes nothing.
  workflow_dispatch:

concurrency:
  # A newer run supersedes stale work on the same branch or pull-request ref.
  # Keep every default-branch and release-tag run as durable release evidence.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) && !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  # The whole canonical gate on all three OS (Windows x64, macOS arm64, Linux x64
  # per ADR 0027): typecheck, format, lint, `bun test` with the Solid preload,
  # the host compile, and the compiled-binary smoke — under the pinned Bun alone,
  # with no Node toolchain step (ADR 0030). Run as the individual `bun run check`
  # links rather than one `bun run check` step, so each link's per-OS duration is
  # visible in CI; step order and stop-on-first-failure match the `&&` chain, and
  # `bun run check` stays the one local entrypoint.
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Configure operational logs
        shell: bash
        env:
          SECANT_LOG_DIR: ${{ runner.temp }}/secant-operational-logs
        run: printf 'SECANT_LOG_DIR=%s\n' "$SECANT_LOG_DIR" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # Reads the exact Bun pin from package.json's packageManager field.
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Migrations check
        run: bun run migrations:check
      - name: Typecheck
        run: bun run typecheck
      - name: Format check
        run: bun run format:check
      - name: Lint
        run: bun run lint
      - name: Structural check
        run: bun run structure:check
      - name: Unused-code check
        run: bun run unused:check
      - name: Configure Windows test temp drive
        id: windows_test_temp
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not $env:RUNNER_TEMP -or -not $env:SystemDrive) {
            throw "Windows test temp setup needs RUNNER_TEMP and SystemDrive."
          }
          $runnerTemp = (Resolve-Path -LiteralPath $env:RUNNER_TEMP).ProviderPath
          $runnerDrive = [IO.Path]::GetPathRoot($runnerTemp).TrimEnd('\')
          $systemDrive = $env:SystemDrive.TrimEnd('\')
          Write-Host "RUNNER_TEMP resolves to $runnerTemp (drive $runnerDrive); system drive: $systemDrive"
          if ($runnerDrive -ieq $systemDrive) {
            throw "RUNNER_TEMP ($runnerTemp) is on the system drive ($systemDrive); Windows tests require a separate temp drive."
          }
          $testTemp = Join-Path $runnerTemp 'secant-tests'
          New-Item -ItemType Directory -Force -Path $testTemp | Out-Null
          Write-Host "Windows test TEMP and TMP: $testTemp"
          "TEMP=$testTemp" >> $env:GITHUB_ENV
          "TMP=$testTemp" >> $env:GITHUB_ENV
      - name: operation-receipt-identity-and-lifetime
        run: >-
          bun run test --
          tests/application/operation-receipt.test.ts
          tests/application/projection-port.test.ts
          tests/application/operation-settlement.test.ts
          tests/application/requested-model.test.ts
          tests/application/observer-lag.test.ts
          tests/composition/application-log.test.ts
      - name: Codex semantic schema qualification
        run: bun run test -- tests/harness/codex-semantic-schema.test.ts
      - name: model-choice-bounded-eligibility
        run: bun run test -- tests/application/requested-model.test.ts
      - name: Claude fallback cleanup retains owner
        run: bun run test -- tests/harness/claude-code-cleanup.test.ts
      - name: retained-step-fault-shutdown
        run: bun run test -- tests/application/retained-step-shutdown.test.ts
      - name: authoritative-run-summary
        run: >-
          bun run test --
          tests/application/run-list.test.ts
          tests/tui/screens.test.tsx
      - name: m10-commands-and-input-rules
        run: >-
          bun run test --
          tests/workflow/workflow.test.ts
          tests/bundle/bundle.test.ts
          tests/application/bundle-install.test.ts
          tests/application/shipped-bundles.test.ts
          tests/application/launch-preparation.test.ts
          tests/run/execution/agent.test.ts
          tests/composition/wiring.test.ts
          tests/release/shipped-bundles.test.ts
          tests/headless/interactive-agent.test.ts
          tests/tui/run-workbench.test.tsx
      - name: m10-home-and-preferences
        run: >-
          bun run test --
          tests/catalog/catalog.test.ts
          tests/application/preferences.test.ts
          tests/headless/settings.test.ts
          tests/architecture/preferences-palettes.test.ts
          tests/tui/screens.test.tsx
          tests/tui/home-preferences.test.tsx
          tests/tui/run-workbench.test.tsx
      - name: m10-full-transcript-prepend
        run: >-
          bun run test --
          tests/tui/run-workbench.test.tsx
          tests/application/transcript-resource.test.ts
          tests/headless/run.test.ts
      - name: m10-workbench-interaction
        run: >-
          bun run test --
          tests/tui/run-workbench.test.tsx
          tests/tui/live-run-workbench.test.tsx
      - name: m10-confirmation-target-identity
        run: bun run test -- tests/tui/run-workbench.test.tsx
      - name: m10-initial-preparation-ownership
        run: >-
          bun run test --
          tests/harness/preparation-ownership.test.ts
          tests/composition/preparation-lifetime.test.ts
          tests/composition/wiring.test.ts
      - name: m10-previous-release-conversation
        run: bun run test -- tests/run/store/conversation-migration.test.ts
      - name: m10-session-history
        run: >-
          bun run test --
          tests/application/session-history.test.ts
          tests/application/observer-lag.test.ts
          tests/harness/message-facts.test.ts
          tests/tui/run-view.test.ts
          tests/tui/run-workbench.test.tsx
          tests/tui/live-run-workbench.test.tsx
      - name: m10-paused-history-identity
        run: >-
          bun run test --
          tests/tui/run-workbench.test.tsx
          tests/tui/run-timeline.test.ts
          tests/tui/run-view.test.ts
          tests/tui/live-run-workbench.test.tsx
      - name: m10-interruption-and-transcript
        run: >-
          bun run test --
          tests/application/session-history.test.ts
          tests/harness/message-facts.test.ts
          tests/run/store/session-and-transcript-evidence.test.ts
          tests/run/execution/agent.test.ts
          tests/application/transcript-resource.test.ts
          tests/application/observer-lag.test.ts
          tests/headless/run.test.ts
      - name: m10-observed-harness-facts
        run: >-
          bun run test --
          tests/harness/observed-facts.test.ts
          tests/harness/message-facts.test.ts
          tests/harness/conformance.test.ts
          tests/harness/preparation-ownership.test.ts
          tests/application/observed-facts.test.ts
          tests/application/harness-request-overlay.test.ts
          tests/headless/run.test.ts
          tests/tui/run-workbench.test.tsx
          tests/tui/live-run-workbench.test.tsx
      - name: Test
        run: bun run test
      - name: Build
        run: bun run build
      - name: Compiled-binary smoke
        run: bun run test:package
      - name: Process runtime conformance
        # Keep independent failure evidence, but never run on the system disk
        # after the Windows temp-drive guard rejects the runner image.
        if: always() && (runner.os != 'Windows' || steps.windows_test_temp.outcome == 'success')
        run: bun run test:runtime-conformance

      - name: Upload failed-job operational logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: operational-logs-check-${{ matrix.os }}
          path: ${{ env.SECANT_LOG_DIR }}
          retention-days: 30
          if-no-files-found: ignore

  # One Linux runner cross-compiles all three gated targets (ADR 0030). The wide
  # install fetches every platform's @opentui native package so the compile can
  # embed the right one per target.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # @opentui/core@0.4.5 matches the dependency pin; a bump is a deliberate
      # gated PR (ADR 0027). The wide flags pull the native package for every
      # platform, not just this host's.
      - run: bun install --os="*" --cpu="*" "@opentui/core@0.4.5"
      - run: bun run scripts/build.ts --all
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/secant-*
          if-no-files-found: error
      # Assemble the three release archives once from the just-built candidate
      # bytes through the one target manifest, emitting the candidate manifest and
      # SHA256SUMS (#150). Never rebuilds an input; fails closed on disagreement.
      - run: bun run scripts/assemble.ts
      - uses: actions/upload-artifact@v4
        with:
          name: release-archives
          path: dist/release
          if-no-files-found: error
      # Pack the three per-platform npm packages from the same candidate bytes the
      # archives carry, through the one target manifest (#151). It reads the
      # archive candidate manifest, never rebuilds an input, and fails closed on
      # any drift from that candidate; `bun pm pack` needs no Node toolchain.
      - run: bun run scripts/pack.ts
      # Pack the thin, script-free npm launcher (@secantdev/secant, #152) beside the
      # platform packages it declares as exact-version optional dependencies. It
      # carries the Node launcher and legal material but no candidate executable, and
      # pins the same assembled release version. It rides in the same artifact.
      - run: bun run scripts/pack-launcher.ts
      - uses: actions/upload-artifact@v4
        with:
          name: platform-packages
          path: dist/packages
          if-no-files-found: error
      # The M4 release legal-closure gate (#156): with every target cross-compiled,
      # every platform native installed, and all four channels packed, verify here —
      # on this one runner, spawn-free — that THIRD-PARTY-NOTICES.md covers the
      # runtime closure actually embedded per target and that every channel ships the
      # source-of-truth legal material. It is OS-independent, so it needs no matrix.
      # The fast declared-dependency check stays in `bun run check`. Enumerated once
      # in docs/agents/release-consumers.md.
      - run: bun run scripts/inventory.ts
      # The candidate-validation dry-run (#157): ONLY on a manual dispatch, a
      # separately configured READ-ONLY npm identity (no publication authority)
      # authenticates (`npm whoami`) and publish-dry-runs every platform package
      # first and the launcher last, against the one candidate just packed above —
      # proving the npm release path end to end with no route to publication (spec
      # #137 stories 85/89). It rehearses the packed bytes in place, so it folds into
      # this job rather than paying for its own runner; it is registry-facing and
      # OS-independent, so it needs no matrix. `--dry-run` skips only the upload, the
      # identity cannot publish regardless, and the credential is scoped to this one
      # dispatch-gated step. No publication credential, publish step, GitHub-release
      # step, retry, or public-asset path exists anywhere in this workflow; the
      # release-workflow policy check proves it. Enumerated in release-workflow.md.
      - name: Dry-run the npm candidate under the read-only identity
        if: github.event_name == 'workflow_dispatch'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_READONLY_TOKEN }}
        run: |
          set -euo pipefail
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > "$HOME/.npmrc"
          bun scripts/npm-dry-run.ts dist/packages

  # One consumer runner per OS executes all seven native scenarios against the
  # candidate assembled by `build`. Each scenario is allowed to finish independently
  # so every result remains visible; the final aggregation step fails the job if any
  # scenario did not succeed. The scripts, arguments, and assertions remain the same.
  consumer:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            binary: secant-windows-x64.exe
            archive: secant-windows-x64.zip
            target: windows-x64
          - os: macos-latest
            binary: secant-darwin-arm64
            archive: secant-darwin-arm64.zip
            target: darwin-arm64
          - os: ubuntu-latest
            binary: secant-linux-x64
            archive: secant-linux-x64.tar.gz
            target: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Configure operational logs
        shell: bash
        env:
          SECANT_LOG_DIR: ${{ runner.temp }}/secant-operational-logs
        run: printf 'SECANT_LOG_DIR=%s\n' "$SECANT_LOG_DIR" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # The compiled-binary smoke and npm-launcher consumer use the recorded
      # Harness helpers; installing once also gives every scenario the pinned Bun.
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: release-archives
          path: dist/release
      - uses: actions/download-artifact@v4
        with:
          name: platform-packages
          path: dist/packages
      - name: Restore the executable bit
        if: runner.os != 'Windows'
        run: chmod +x "dist/${{ matrix.binary }}"
      # Both installer consumers need a native candidate whose `--version` never
      # exits, to prove the installer's bounded version probe. It is built with the
      # pinned Bun from source written here, so it is signed like the real candidate
      # on macOS and adds no tracked file.
      - name: Build the hanging version-probe stand-in
        shell: bash
        run: |
          set -euo pipefail
          stand_in_dir="$RUNNER_TEMP/hanging-candidate"
          mkdir -p "$stand_in_dir"
          printf 'setInterval(() => {}, 1 << 30);\n' >"$stand_in_dir/hang.ts"
          bun build --compile "$stand_in_dir/hang.ts" --outfile "$stand_in_dir/hang${{ runner.os == 'Windows' && '.exe' || '' }}"
      - name: Compiled-binary smoke
        id: compiled_binary_smoke
        continue-on-error: true
        run: bun scripts/package-smoke.ts "dist/${{ matrix.binary }}"
      - name: Release archive consumer
        id: release_archive_consumer
        continue-on-error: true
        run: bun scripts/release-consumer.ts "dist/release/${{ matrix.archive }}"
      - name: Platform package consumer
        id: platform_package_consumer
        continue-on-error: true
        run: bun scripts/package-consumer.ts dist/packages ${{ matrix.target }}
      - name: npm launcher consumer
        id: npm_launcher_consumer
        continue-on-error: true
        run: bun scripts/launcher-consumer.ts dist/packages
      - name: PowerShell installer consumer
        id: powershell_installer_consumer
        continue-on-error: true
        shell: pwsh
        run: |
          if ("${{ runner.os }}" -eq "Windows") {
            ./scripts/powershell-installer-consumer.ps1 -CandidateDirectory dist/release -Scenario supported -HangingExecutable "$env:RUNNER_TEMP/hanging-candidate/hang.exe"
          } else {
            ./scripts/powershell-installer-consumer.ps1 -CandidateDirectory dist/release -Scenario unsupported
          }
      - name: POSIX installer consumer
        id: posix_installer_consumer
        continue-on-error: true
        shell: bash
        run: |
          if [ "${{ runner.os }}" = 'Windows' ]; then
            bash scripts/posix-installer-consumer.sh --scenario unsupported --candidate-dir dist/release
          else
            bash scripts/posix-installer-consumer.sh --scenario supported --candidate-dir dist/release \
              --hanging-executable "$RUNNER_TEMP/hanging-candidate/hang"
          fi
      - name: Terminal lifecycle
        id: terminal_lifecycle
        continue-on-error: true
        run: bun tests/terminal/lifecycle.ts "dist/${{ matrix.binary }}"
      - name: Require every consumer scenario to succeed
        id: consumer_result
        if: always()
        shell: bash
        run: |
          failed=0
          for result in \
            "Compiled-binary smoke:${{ steps.compiled_binary_smoke.outcome }}" \
            "Release archive consumer:${{ steps.release_archive_consumer.outcome }}" \
            "Platform package consumer:${{ steps.platform_package_consumer.outcome }}" \
            "npm launcher consumer:${{ steps.npm_launcher_consumer.outcome }}" \
            "PowerShell installer consumer:${{ steps.powershell_installer_consumer.outcome }}" \
            "POSIX installer consumer:${{ steps.posix_installer_consumer.outcome }}" \
            "Terminal lifecycle:${{ steps.terminal_lifecycle.outcome }}"
          do
            name="${result%%:*}"
            outcome="${result#*:}"
            printf '%s: %s\n' "$name" "$outcome"
            if [ "$outcome" != 'success' ]; then
              failed=1
            fi
          done
          exit "$failed"

      - name: Upload failed-job operational logs
        if: failure() && steps.consumer_result.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: operational-logs-consumer-${{ matrix.os }}
          path: ${{ env.SECANT_LOG_DIR }}
          retention-days: 30
          if-no-files-found: ignore

  # The `release-protection-policy` scenario, runtime half (#158, spec #137 stories
  # 82/90/96/97): on a `v*` tag ONLY, admit the tag when it exactly matches the package
  # version — no branch run substitutes — and write the reviewer's approval summary
  # (tag, commit, version, candidate digests, locked Shipped Bundles, blocking jobs,
  # checklist reference, and Windows Terminal evidence trigger) to the run summary the protected `promote` job
  # gates on. It depends on every candidate check, so the summary can only be produced
  # once they are green, and it downloads the assembled candidate rather than rebuilding
  # it. It holds no credential and publishes nothing. Enumerated in
  # docs/agents/release-workflow.md; the deterministic policy check proves the shape.
  release-approval:
    needs:
      - check
      - build
      - consumer
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags so the gate can compare the terminal inputs (Bun pin,
          # @opentui/core pin, renderer) against the previous release tag.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/download-artifact@v4
        with:
          name: release-archives
          path: dist/release
      - run: bun scripts/release-gate.ts dist/release

  # The `release-promotion-state-machine` scenario (#159, spec #137 stories 86-90):
  # on a `v*` tag ONLY, this job targets the GitHub `release` environment, so it
  # pauses until Rohan — configured out of band as the sole required reviewer
  # (docs/agents/release-workflow.md) — approves the release-approval summary. It
  # downloads the already-built archive and npm-package artifacts, re-verifies every
  # manifest and digest, and never rebuilds or repacks. The state machine accepts an
  # existing npm version only when its registry tarball bytes match, publishes every
  # platform package before the launcher, stages approved GitHub assets on a draft,
  # and exposes that release only after npm succeeds. The publication identity is an
  # environment-scoped secret unavailable to every earlier job.
  promote:
    needs: release-approval
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/download-artifact@v4
        with:
          name: release-archives
          path: dist/release
      - uses: actions/download-artifact@v4
        with:
          name: platform-packages
          path: dist/packages
      - name: Publish the approved candidate npm-first and GitHub-last
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/secant-promotion.npmrc
        run: |
          set -euo pipefail
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > "$NPM_CONFIG_USERCONFIG"
          bun scripts/release-promote.ts dist/release dist/packages
