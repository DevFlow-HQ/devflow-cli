# THROWAWAY workflow for prototype ticket DevFlow-HQ/devflow-cli#6.
# Lives only on the prototype/opencode-shell branch. Delete with the prototype.
#
# Produces the Windows/macOS/Linux half of the ticket's evidence: a real PTY
# (ConPTY on Windows) drives the shell through every exit path and asserts the
# terminal-restoring escape sequences were actually emitted.

name: Prototype Shell (#6)

on:
  push:
    branches: [prototype/opencode-shell]
  workflow_dispatch:

defaults:
  run:
    working-directory: prototypes/opencode-shell

jobs:
  shell:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # A hung pty must fail fast, not burn a runner. The whole suite is ~1 min.
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Node 26 (OpenTUI's node:ffi requirement)
        uses: actions/setup-node@v4
        with:
          node-version: 26.7.0

      - name: Install Bun 1.3.14 (OpenCode's pinned version)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Report runtimes
        run: |
          node -v
          bun -v
          echo "runner: ${{ runner.os }} ${{ runner.arch }}"

      # `ci`, not `install`. This workflow produces #6's cross-platform evidence, so
      # the dependency set is part of the measurement. Both install from the committed
      # lockfile; the difference is that `install` silently rewrites it when it
      # disagrees with package.json -- here, on a runner, where the rewrite is
      # discarded and the drift never surfaces. `ci` fails the build instead.
      #
      # Note it installs only the host's optional OpenTUI native. Step 4 adds the
      # other seven back before compiling.
      - run: npm ci --no-audit --no-fund

      # 1. The seam is testable with no terminal, no OpenTUI, no native library.
      - name: Seam tests (no terminal)
        run: node --test test/seam.test.mjs

      # 2. Does OpenTUI load and create/destroy a renderer under each runtime?
      - name: Spike - bun arm
        run: bun src/spike.mjs
      - name: Spike - node arm
        run: node --experimental-ffi --no-warnings src/spike.mjs

      # 3. Real-PTY lifecycle: every exit path restores the terminal exactly once.
      - name: PTY lifecycle - bun arm
        env:
          CRUCIBLE_ARM: bun
          CRUCIBLE_RUNTIME: bun
        run: node --test test/lifecycle.pty.test.mjs

      - name: PTY lifecycle - node arm
        env:
          CRUCIBLE_ARM: node
          CRUCIBLE_RUNTIME: node
        run: node --test test/lifecycle.pty.test.mjs

      # 3b. Evidence for which actor emits terminal mode sequences on this platform.
      - name: ConPTY / terminal negotiation probe
        if: always()
        env:
          CRUCIBLE_ARM: bun
          CRUCIBLE_RUNTIME: bun
        run: node scripts/conpty-probe.mjs

      # 4. Packaging: a standalone binary that runs with no node_modules present.
      - name: Install OpenTUI native packages for compilation
        run: node scripts/install-natives.mjs

      - name: Compile standalone binary (bun arm)
        run: bun build --compile src/main.mjs --outfile dist/crucible-shell

      - name: Smoke the packaged binary outside its workspace
        run: node scripts/smoke-packaged.mjs

      - name: Report artifact size
        run: node scripts/report-size.mjs
