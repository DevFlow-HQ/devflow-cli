<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Crucible TUI IA Prototype</title>
    <style>
      /*
       * PROTOTYPE: Three variants of Crucible's launch and Run information architecture,
       * switchable via ?variant=, as a static throwaway artifact.
       *
       * Question: Which rough TUI information architecture makes launch, current Run work,
       * recovery, Harness output, gates, requests, and resources understandable while keeping
       * orchestration behind the Projection Port?
       *
       * Accept if one variant, or a clear hybrid, exposes the durable/live/action/resource
       * distinctions without needing a rich Workspace browser or fake actions.
       */
      :root {
        color-scheme: dark;
        --bg: #101214;
        --panel: #171b1f;
        --panel-2: #20262b;
        --panel-3: #252118;
        --ink: #f2efe7;
        --muted: #a9b0b7;
        --line: #3a4148;
        --green: #8fbf88;
        --blue: #83b7d8;
        --gold: #d7b56d;
        --red: #d67d78;
        --violet: #c09bd8;
        --cyan: #78c6c8;
        --shadow: 0 18px 46px rgba(0, 0, 0, 0.36);
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          "Liberation Mono", monospace;
        font-size: 15px;
        letter-spacing: 0;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.025), transparent 45%),
          radial-gradient(
            circle at 10% 0%,
            rgba(120, 198, 200, 0.12),
            transparent 30rem
          ),
          var(--bg);
      }

      button {
        border: 1px solid var(--line);
        border-radius: 6px;
        color: var(--ink);
        background: var(--panel-2);
        font: inherit;
        padding: 0.45rem 0.65rem;
      }

      button.primary {
        border-color: #b08e49;
        background: #423620;
      }

      button.danger {
        border-color: #8b4c49;
        background: #402221;
      }

      button[disabled] {
        color: #737a81;
        background: #16191c;
      }

      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible {
        outline: 2px solid var(--cyan);
        outline-offset: 2px;
      }

      .screen {
        min-height: 100vh;
        padding: 1rem 1rem 5.5rem;
      }

      .topline {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 2.25rem;
        border-bottom: 1px solid var(--line);
        color: var(--muted);
      }

      .brand {
        color: var(--ink);
        font-weight: 700;
      }

      .muted {
        color: var(--muted);
      }

      .tag {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 0.15rem 0.5rem;
        white-space: nowrap;
        color: var(--muted);
        background: rgba(255, 255, 255, 0.03);
      }

      .status {
        color: var(--ink);
      }

      .status::before {
        content: attr(data-symbol);
        display: inline-block;
        width: 1.2rem;
        color: var(--status-color, var(--ink));
      }

      .ok {
        --status-color: var(--green);
      }

      .warn {
        --status-color: var(--gold);
      }

      .info {
        --status-color: var(--blue);
      }

      .bad {
        --status-color: var(--red);
      }

      .grid {
        display: grid;
        gap: 1rem;
      }

      .panel {
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: rgba(23, 27, 31, 0.92);
      }

      .panel h2,
      .panel h3 {
        margin: 0;
        padding: 0.7rem 0.8rem;
        border-bottom: 1px solid var(--line);
        font-size: 0.9rem;
        color: #f6e6b2;
      }

      .panel-body {
        padding: 0.8rem;
      }

      .list {
        display: grid;
        gap: 0.45rem;
      }

      .row {
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 0.65rem;
        align-items: start;
        min-height: 2rem;
        padding: 0.45rem 0;
        border-bottom: 1px solid rgba(58, 65, 72, 0.55);
      }

      .row:last-child {
        border-bottom: 0;
      }

      .row strong {
        color: var(--ink);
      }

      .cols {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.65rem;
      }

      .mini {
        border: 1px solid rgba(58, 65, 72, 0.7);
        border-radius: 6px;
        padding: 0.55rem;
        background: rgba(255, 255, 255, 0.025);
      }

      .mini b {
        display: block;
        margin-bottom: 0.3rem;
        color: #f2d78c;
      }

      .mono-lines {
        display: grid;
        gap: 0.35rem;
      }

      .line {
        display: grid;
        grid-template-columns: 5.2rem 1fr;
        gap: 0.6rem;
        min-width: 0;
      }

      .line span:last-child,
      .row > div {
        min-width: 0;
        overflow-wrap: anywhere;
      }

      .kbdbar {
        position: fixed;
        left: 50%;
        bottom: 1rem;
        z-index: 20;
        display: grid;
        grid-template-columns: 2.4rem minmax(12rem, 1fr) 2.4rem;
        align-items: center;
        gap: 0.45rem;
        width: min(28rem, calc(100vw - 2rem));
        border: 1px solid #58616a;
        border-radius: 999px;
        padding: 0.45rem;
        background: rgba(10, 12, 14, 0.95);
        box-shadow: var(--shadow);
        transform: translateX(-50%);
      }

      .kbdbar button {
        border-radius: 999px;
        padding: 0.4rem;
      }

      .kbdbar .label {
        text-align: center;
        color: var(--ink);
        overflow-wrap: anywhere;
      }

      .state-dump {
        white-space: pre-wrap;
        color: #ccd2d8;
        font-size: 0.82rem;
        line-height: 1.45;
      }

      .home {
        display: grid;
        grid-template-rows: auto 1fr;
      }

      .home-main {
        display: grid;
        place-content: center;
        min-height: calc(100vh - 8rem);
        text-align: center;
      }

      .workspace-name {
        margin: 0;
        font-size: 2.25rem;
        font-weight: 700;
      }

      .workspace-path {
        margin: 0.55rem 0 2.25rem;
        color: var(--muted);
        overflow-wrap: anywhere;
      }

      .home-actions {
        display: grid;
        gap: 0.5rem;
        width: min(25rem, calc(100vw - 2rem));
      }

      .home-actions button {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 3rem;
        padding: 0.65rem 0.8rem;
        text-align: left;
      }

      .home-actions button::after {
        content: ">";
        color: var(--muted);
      }

      .home-summary {
        margin: 1.15rem 0 0;
        color: var(--muted);
        font-size: 0.86rem;
      }

      .launch-shell {
        width: min(66rem, 100%);
        margin: 0 auto;
      }

      .launch-heading {
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 0.8rem;
        align-items: center;
        min-height: 4rem;
        border-bottom: 1px solid var(--line);
      }

      .launch-heading h1 {
        margin: 0;
        font-size: 1.15rem;
      }

      .launch-content {
        padding-top: 2rem;
      }

      .launch-content-narrow {
        width: min(40rem, 100%);
        margin: 0 auto;
      }

      .choice-list {
        display: grid;
        gap: 0.5rem;
      }

      .choice-button {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 1rem;
        width: 100%;
        min-height: 4rem;
        padding: 0.7rem 0.8rem;
        text-align: left;
      }

      .choice-button[aria-pressed="true"] {
        border-color: var(--cyan);
        background: #203033;
      }

      .choice-button strong,
      .choice-button small {
        display: block;
      }

      .choice-button small {
        margin-top: 0.25rem;
        color: var(--muted);
      }

      .choice-button .choice-meta {
        align-self: center;
        color: var(--muted);
        white-space: nowrap;
      }

      .bundle-recency {
        align-self: end;
        color: var(--muted);
        font-size: 0.72rem;
        font-weight: 400;
        white-space: nowrap;
      }

      .workflow-layout {
        display: grid;
        grid-template-columns: minmax(20rem, 1fr) minmax(20rem, 0.8fr);
        gap: 1rem;
        align-items: start;
      }

      .workflow-layout.single {
        grid-template-columns: minmax(20rem, 40rem);
      }

      .workflow-side {
        display: grid;
        gap: 0.75rem;
      }

      .bundle-details {
        min-height: 19rem;
      }

      .harness-layout {
        display: grid;
        grid-template-columns: minmax(18rem, 1fr) minmax(20rem, 0.85fr);
        gap: 1rem;
        align-items: start;
      }

      .harness-layout.single {
        grid-template-columns: minmax(18rem, 40rem);
      }

      .configuration-panel {
        min-height: 20rem;
      }

      .form-fields {
        display: grid;
        gap: 1rem;
      }

      .field {
        display: grid;
        gap: 0.4rem;
      }

      .field label {
        color: var(--muted);
      }

      .field input,
      .field select,
      .field textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 0.6rem;
        color: var(--ink);
        background: #111417;
        font: inherit;
      }

      .field textarea {
        min-height: 12rem;
        resize: vertical;
        line-height: 1.5;
      }

      .launch-actions {
        display: flex;
        justify-content: flex-end;
        gap: 0.5rem;
        margin-top: 1.25rem;
      }

      .review-list {
        display: grid;
        gap: 0.7rem;
      }

      .review-item {
        display: grid;
        grid-template-columns: 9rem 1fr;
        gap: 1rem;
        padding-bottom: 0.7rem;
        border-bottom: 1px solid var(--line);
      }

      .review-item > * {
        min-width: 0;
        overflow-wrap: anywhere;
      }

      .trust-confirmation {
        display: flex;
        gap: 0.65rem;
        align-items: flex-start;
        margin-top: 1.25rem;
        padding: 0.8rem;
        border: 1px solid #7c6434;
        border-radius: 6px;
        background: #2c261a;
      }

      .variant-b .layout {
        grid-template-columns: minmax(13rem, 17rem) minmax(26rem, 1fr) minmax(
            18rem,
            23rem
          );
        margin-top: 1rem;
      }

      .variant-b .timeline {
        min-height: 32rem;
        display: flex;
        flex-direction: column;
      }

      .timeline-scroll {
        flex: 1;
        overflow: auto;
        padding: 0.75rem;
      }

      .entry {
        display: grid;
        grid-template-columns: 7.8rem 1fr;
        gap: 0.7rem;
        padding: 0.55rem 0;
        border-bottom: 1px solid rgba(58, 65, 72, 0.5);
      }

      .entry .kind {
        color: var(--cyan);
      }

      .entry .durable {
        color: var(--gold);
      }

      .entry .live {
        color: var(--violet);
      }

      .compose {
        border-top: 1px solid var(--line);
        display: grid;
        grid-template-columns: 1fr auto auto;
        gap: 0.5rem;
        padding: 0.6rem;
      }

      .compose input {
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 0.5rem;
        color: var(--ink);
        background: #111417;
        font: inherit;
      }

      .variant-c .layout {
        grid-template-columns: minmax(12rem, 16rem) minmax(20rem, 27rem) minmax(
            24rem,
            1fr
          );
        margin-top: 1rem;
      }

      .nav button {
        width: 100%;
        margin-bottom: 0.45rem;
        text-align: left;
      }

      .diagram {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 0.55rem;
      }

      .diagram .mini {
        min-height: 6.5rem;
      }

      @media (max-width: 1050px) {
        .variant-a .layout,
        .variant-b .layout,
        .variant-c .layout {
          grid-template-columns: 1fr;
        }

        .diagram,
        .cols,
        .workflow-layout,
        .harness-layout {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <section id="fallback" class="screen">
      <div class="topline">
        <div>
          <span class="brand">Crucible</span>
          <span class="muted">TUI IA prototype</span>
        </div>
        <div class="tag">Loading</div>
      </div>
      <section class="panel" style="margin-top: 1rem">
        <h2>Prototype failed to render</h2>
        <div class="panel-body">
          If this message stays visible, the browser could not run the prototype
          script. The artifact is a static file; try a current Chrome, Safari,
          Firefox, or Edge.
        </div>
      </section>
    </section>
    <main id="app"></main>

    <script>
      const variants = {
        H: {
          name: "Workspace Home",
          thesis:
            "Start with one Workspace and a small set of real paths, then reveal detail only after the user chooses a task.",
        },
        A: {
          name: "Progressive Launch",
          thesis:
            "Ask for one launch decision at a time, then show trust and preflight evidence only at final review.",
        },
        B: {
          name: "Run Workbench",
          thesis:
            "Make the normal post-submit experience the Run timeline, with control-plane operations kept small and peripheral.",
        },
        C: {
          name: "Catalog Inspector",
          thesis:
            "Use one stable inspector shell for Bundle, Harness, launch, and Run focus so headless projections map cleanly to TUI views.",
        },
      };

      const sample = {
        workspace: "/Users/rohan/src/example-service",
        bundle: "io.devflow.test-repair@1.0.0",
        digest: "sha256:48e8...b91c",
        harness: "Codex",
        requestedModel: "gpt-5-codex",
        effectiveModel: "gpt-5-codex",
        run: "run_01JCRUCIBLE",
        state: "blocked",
        step: "approve-fix",
        attempt: "approve-fix / iteration 2 / attempt 1",
        projectionState: {
          opened: "run",
          durableCursor: "run:01JCRUCIBLE:000184",
          liveGeneration: "turn:main:7",
          actionOffers: [
            "answer-human-gate",
            "send-interactive-turn",
            "steer-turn",
            "interrupt-turn unavailable: harness does not support mid-turn interrupt",
          ],
          resources: [
            "older-session-page",
            "artifact-index",
            "diagnostic-index",
            "workspace-materialization-details",
          ],
        },
      };

      const workflowBundles = [
        {
          name: "Test Repair",
          identity: "io.devflow.test-repair@1.0.0",
          version: "1.0.0",
          description:
            "Drive one failing test to green, then ask for approval.",
          lastUsed: "Used 2 hours ago",
          expects:
            "A test path and any constraints you want the agent to follow.",
          interaction: "Approval before the final commit.",
          digest:
            "sha256:48e8a90bb6f2b80b99781c1bf676bf315b523f819852bad0c6392de88a27b91c",
        },
        {
          name: "Git Diff Review",
          identity: "io.devflow.diff-review@1.1.0",
          version: "1.1.0",
          description: "Review the current Git diff and confirm the findings.",
          lastUsed: "Used yesterday",
          expects: "Any areas, risks, or files that deserve extra attention.",
          interaction: "Confirmation after findings are prepared.",
          digest:
            "sha256:cb34eb16a614573e2713f2c22c7c86569ac847fbfa1fb10c96135b55b5cd6f19",
        },
        {
          name: "Issue to Pull Request",
          identity: "io.devflow.issue-to-pr@2.0.0",
          version: "2.0.0",
          description:
            "Turn a prepared issue into an implementation and pull request.",
          lastUsed: "Used 6 days ago",
          expects: "The issue location and implementation constraints.",
          interaction:
            "Questions during planning and approval before publishing.",
          digest:
            "sha256:a6b79fb09f2c4573cbafd69d924a78f80ce26cf77009af765f24b3c8be2368bf",
        },
        {
          name: "Dependency Upgrade",
          identity: "io.devflow.dependency-upgrade@1.0.0",
          version: "1.0.0",
          description: "Upgrade one dependency and verify the Workspace.",
          lastUsed: "Never used",
          expects:
            "The dependency, target version, and compatibility constraints.",
          interaction: "Approval if the upgrade needs broader changes.",
          digest:
            "sha256:856bf331f350db309e09272d8734576ec9b713fe726f9b01fdcf5339c51d6c38",
        },
      ];

      const harnesses = [
        {
          name: "Codex",
          detail: "Qualified · session recovery available",
          models: ["gpt-5-codex", "gpt-5"],
        },
        {
          name: "Claude Code",
          detail: "Qualified · interactive requests available",
          models: ["claude-opus-4-1", "claude-sonnet-4"],
        },
        {
          name: "Gemini",
          detail: "Qualified · interrupt unavailable",
          models: ["gemini-2.5-pro", "gemini-2.5-flash"],
        },
      ];

      const launchDraft = {
        step: "bundle",
        bundleIndex: null,
        harnessIndex: null,
        model: "",
        generalInstructions: "",
        trustApproved: false,
      };

      const trustedBundleIndexes = new Set();

      function currentVariantKey() {
        const key = new URLSearchParams(location.search).get("variant") || "H";
        return variants[key] ? key : "H";
      }

      function setVariant(next) {
        const params = new URLSearchParams(location.search);
        params.set("variant", next);
        history.replaceState(
          null,
          "",
          `${location.pathname}?${params.toString()}`,
        );
        render();
      }

      function resetLaunchDraft() {
        launchDraft.step = "bundle";
        launchDraft.bundleIndex = null;
        launchDraft.harnessIndex = null;
        launchDraft.model = "";
        launchDraft.generalInstructions = "";
        launchDraft.trustApproved = false;
      }

      function openView(next) {
        if (next === "A") resetLaunchDraft();
        setVariant(next);
      }

      function cycle(offset) {
        const keys = Object.keys(variants);
        const current = keys.indexOf(currentVariantKey());
        const next = keys[(current + offset + keys.length) % keys.length];
        setVariant(next);
      }

      function status(symbol, cls, label) {
        return `<span class="status ${cls}" data-symbol="${symbol}">${label}</span>`;
      }

      function row(left, main, right = "") {
        return `<div class="row"><span class="muted">${left}</span><div>${main}</div><span>${right}</span></div>`;
      }

      function topLine(key) {
        return `
          <div class="topline">
            <div><span class="brand">Crucible</span> <span class="muted">TUI IA prototype</span></div>
            <div class="tag">${key} ${variants[key].name}</div>
          </div>
        `;
      }

      function stateDump(key) {
        return `<section class="panel">
          <h2>Projected state visible in this variant</h2>
          <div class="panel-body state-dump">${JSON.stringify(
            {
              variant: `${key} ${variants[key].name}`,
              designThesis: variants[key].thesis,
              sample,
            },
            null,
            2,
          )}</div>
        </section>`;
      }

      function switcher(key) {
        return `<nav class="kbdbar" aria-label="Prototype variant switcher">
          <button type="button" title="Previous variant" aria-label="Previous variant" data-dir="-1">&larr;</button>
          <div class="label">${key} (${variants[key].name})</div>
          <button type="button" title="Next variant" aria-label="Next variant" data-dir="1">&rarr;</button>
        </nav>`;
      }

      function workspaceHome() {
        return `
          <section class="screen home">
            ${topLine("H")}
            <main class="home-main">
              <div>
                <h1 class="workspace-name">example-service</h1>
                <p class="workspace-path">${sample.workspace}</p>
                <nav class="home-actions" aria-label="Workspace actions">
                  <button type="button" class="primary" data-view="A">Start a Run</button>
                  <button type="button" data-view="C">Workflow Bundles</button>
                  <button type="button" data-view="B">Previous Runs</button>
                  <button type="button" data-view="C">Harnesses</button>
                </nav>
                <p class="home-summary">4 Workflow Bundles · 3 previous Runs · ${sample.harness} qualified</p>
              </div>
            </main>
            ${switcher("H")}
          </section>
        `;
      }

      function launchHeading(title, stepNumber) {
        const previousSteps = {
          bundle: "home",
          harness: "bundle",
          inputs: "harness",
          review: "inputs",
        };
        const previousStep = previousSteps[launchDraft.step];

        return `<header class="launch-heading">
          <button type="button" aria-label="Back" title="Back" data-launch-back="${previousStep}">&larr;</button>
          <h1>${title}</h1>
          <span class="tag">${stepNumber} of 4</span>
        </header>`;
      }

      function workflowBundleChoices() {
        return workflowBundles
          .map(
            (bundle, index) => `
              <button type="button" class="choice-button" data-bundle-index="${index}" aria-pressed="${launchDraft.bundleIndex === index}">
                <span>
                  <strong>${bundle.name}</strong>
                  <small>${bundle.description}</small>
                </span>
                <span class="bundle-recency">${bundle.lastUsed}</span>
              </button>`,
          )
          .join("");
      }

      function workflowBundleDetails() {
        if (launchDraft.bundleIndex === null) return "";

        const bundle = workflowBundles[launchDraft.bundleIndex];
        return `<div class="workflow-side">
          <aside class="panel bundle-details">
            <h2>${bundle.name}</h2>
            <div class="panel-body review-list">
              <div class="review-item"><span class="muted">Purpose</span><span>${bundle.description}</span></div>
              <div class="review-item"><span class="muted">You provide</span><span>${bundle.expects}</span></div>
              <div class="review-item"><span class="muted">Your involvement</span><span>${bundle.interaction}</span></div>
              <div class="review-item"><span class="muted">Version</span><span>${bundle.version}</span></div>
            </div>
          </aside>
          <div class="launch-actions">
            <button type="button" class="primary" data-launch-next="harness">Continue</button>
          </div>
        </div>`;
      }

      function launchBundleStep() {
        const layoutClass =
          launchDraft.bundleIndex === null
            ? "workflow-layout single"
            : "workflow-layout";

        return `${launchHeading("Choose a Workflow Bundle", 1)}
          <div class="launch-content ${layoutClass}">
            <div class="choice-list">${workflowBundleChoices()}</div>
            ${workflowBundleDetails()}
          </div>`;
      }

      function harnessChoices() {
        return harnesses
          .map(
            (harness, index) => `
              <button type="button" class="choice-button" data-harness-index="${index}" aria-pressed="${launchDraft.harnessIndex === index}">
                <span>
                  <strong>${harness.name}</strong>
                  <small>${harness.detail}</small>
                </span>
                <span class="choice-meta">${launchDraft.harnessIndex === index ? "Selected" : ">"}</span>
              </button>`,
          )
          .join("");
      }

      function harnessConfiguration() {
        if (launchDraft.harnessIndex === null) return "";

        const harness = harnesses[launchDraft.harnessIndex];
        const modelOptions = harness.models
          .map(
            (model) =>
              `<option value="${model}" ${launchDraft.model === model ? "selected" : ""}>${model}</option>`,
          )
          .join("");

        return `<aside class="panel configuration-panel">
          <h2>Configure ${harness.name}</h2>
          <div class="panel-body form-fields">
            <div class="field">
              <label for="launch-model">Model</label>
              <select id="launch-model" data-launch-model>${modelOptions}</select>
            </div>
            <div class="mini">
              <b>Session continuity</b>
              ${harness.detail}
            </div>
            <div class="launch-actions">
              <button type="button" class="primary" data-launch-next="inputs">Continue</button>
            </div>
          </div>
        </aside>`;
      }

      function launchHarnessStep() {
        const layoutClass =
          launchDraft.harnessIndex === null
            ? "harness-layout single"
            : "harness-layout";

        return `${launchHeading("Choose a Harness", 2)}
          <div class="launch-content ${layoutClass}">
            <div class="choice-list">${harnessChoices()}</div>
            ${harnessConfiguration()}
          </div>`;
      }

      function launchInputsStep() {
        return `${launchHeading("Provide Run inputs", 3)}
          <div class="launch-content launch-content-narrow">
            <div class="form-fields">
              <div class="field">
                <label for="general-instructions">General instructions (required)</label>
                <textarea id="general-instructions" data-general-instructions placeholder="Describe the outcome, concerns, constraints, and relevant file locations.">${launchDraft.generalInstructions}</textarea>
              </div>
            </div>
            <div class="launch-actions">
              <button type="button" class="primary" data-launch-next="review" ${launchDraft.generalInstructions.trim() ? "" : "disabled"}>Review Run</button>
            </div>
          </div>`;
      }

      function launchReviewStep() {
        const bundle = workflowBundles[launchDraft.bundleIndex];
        const harness = harnesses[launchDraft.harnessIndex];
        const isTrusted = trustedBundleIndexes.has(launchDraft.bundleIndex);
        const trustContent = isTrusted
          ? `<div class="trust-confirmation">${status("+", "ok", "Trust already granted for this exact Bundle digest")}</div>`
          : `<label class="trust-confirmation">
              <input type="checkbox" data-trust-confirmation ${launchDraft.trustApproved ? "checked" : ""} />
              <span>I trust ${bundle.name} ${bundle.version} after reviewing what it can execute.</span>
            </label>`;
        const canStart = isTrusted || launchDraft.trustApproved;

        return `${launchHeading("Review and start", 4)}
          <div class="launch-content launch-content-narrow">
            <div class="review-list">
              <div class="review-item"><span class="muted">Workflow</span><strong>${bundle.name}</strong></div>
              <div class="review-item"><span class="muted">Bundle digest</span><span>${bundle.digest}</span></div>
              <div class="review-item"><span class="muted">Workspace</span><span>${sample.workspace}</span></div>
              <div class="review-item"><span class="muted">Harness</span><span>${harness.name} · ${launchDraft.model}</span></div>
              <div class="review-item"><span class="muted">Instructions</span><span>${launchDraft.generalInstructions || "None provided"}</span></div>
            </div>
            ${trustContent}
            <div class="launch-actions">
              <button type="button" class="primary" data-start-run ${canStart ? "" : "disabled"}>Start Run</button>
            </div>
          </div>`;
      }

      function launchStepContent() {
        if (launchDraft.step === "bundle") return launchBundleStep();
        if (launchDraft.step === "harness") return launchHarnessStep();
        if (launchDraft.step === "inputs") return launchInputsStep();
        return launchReviewStep();
      }

      function variantA() {
        return `<section class="screen variant-a">
          ${topLine("A")}
          <div class="launch-shell">${launchStepContent()}</div>
          ${switcher("A")}
        </section>`;
      }

      function variantB() {
        return `
          <section class="screen variant-b">
            ${topLine("B")}
            <div class="grid layout">
              <section class="panel">
                <h2>Runs</h2>
                <div class="panel-body list">
                  ${row("active", `<strong>${sample.run}</strong><br />${sample.bundle}<br /><span class="muted">${sample.workspace}</span>`, status("!", "warn", "Blocked"))}
                  ${row("resting", "run_01JCPREV<br />same Workspace", status(">", "info", "Resumable"))}
                  ${row("done", "run_01JCPASS<br />Test Repair", status("+", "ok", "Succeeded"))}
                </div>
              </section>

              <section class="panel timeline">
                <h2>Run Timeline</h2>
                <div class="timeline-scroll">
                  <div class="entry"><span class="kind durable">older page</span><div>${status("^", "info", "Load previous session page")} preserves scroll anchor and prepends stable entries.</div></div>
                  <div class="entry"><span class="kind durable">durable</span><div>Baseline command produced verdict <code>fail</code> and text artifact <code>test-output</code>.</div></div>
                  <div class="entry"><span class="kind durable">durable</span><div>Agent attempt completed with effective model ${sample.effectiveModel}.</div></div>
                  <div class="entry"><span class="kind live">live</span><div>Harness request expired with Turn 7; shown as historical evidence, not answerable.</div></div>
                  <div class="entry"><span class="kind durable">gate</span><div>${status("!", "warn", "Human Gate pending")} Approve generated patch? Answer becomes Run Artifact <code>approval</code>.</div></div>
                  <div class="entry"><span class="kind live">preview</span><div>Current replaceable preview: assistant is summarizing changed files.</div></div>
                </div>
                <div class="compose">
                  <input aria-label="Interactive turn input" value="Ask the agent to explain the test failure..." />
                  <button>Send turn</button>
                  <button>End step</button>
                </div>
              </section>

              <section class="panel">
                <h2>Current Offers</h2>
                <div class="panel-body list">
                  ${row("durable", "answer-human-gate", `<button class="primary">Answer</button>`)}
                  ${row("live", "send-interactive-turn", `<button>Send</button>`)}
                  ${row("live", "steer-turn", `<button>Steer</button>`)}
                  ${row("unavailable", "interrupt-turn", status("x", "bad", "Codex session cannot interrupt mid-turn"))}
                  ${row("resource", "Artifacts, transcript export, diagnostics", `<button>Inspect</button>`)}
                  ${row("operation", "Last submission: applied", status("+", "ok", "Receipt only"))}
                </div>
              </section>
              ${stateDump("B")}
            </div>
            ${switcher("B")}
          </section>
        `;
      }

      function variantC() {
        return `
          <section class="screen variant-c">
            ${topLine("C")}
            <div class="grid layout">
              <section class="panel nav">
                <h2>Projection Families</h2>
                <div class="panel-body">
                  <button>Bundle catalog</button>
                  <button>Harness catalog</button>
                  <button class="primary">Launch preparation</button>
                  <button>Run list</button>
                  <button>Exact Run</button>
                  <button>Operation</button>
                </div>
              </section>

              <section class="panel">
                <h2>Focused Inspector</h2>
                <div class="panel-body list">
                  ${row("focus", `<strong>${sample.bundle}</strong><br />highest stable installed version`, status("+", "ok", "Compatible"))}
                  ${row("origin", "local file: ~/Downloads/test-repair.wfb", "")}
                  ${row("routing", "command -> repeat(agent, command) -> human gate -> command", "")}
                  ${row("trust", "not trusted for digest", status("*", "warn", "Grant offer shown"))}
                  ${row("harness", `${sample.harness}; requested ${sample.requestedModel}`, status("+", "ok", "Qualified"))}
                  ${row("workspace", sample.workspace, status("+", "ok", "Preflight passes"))}
                </div>
              </section>

              <section class="panel">
                <h2>Projection Port Shape</h2>
                <div class="panel-body">
                  <div class="diagram">
                    <div class="mini"><b>Durable Snapshot</b>Run state, pending Human Gate, artifacts, recovery evidence, available actions.</div>
                    <div class="mini"><b>Live Overlay</b>Turn phase, Harness Requests, current activity, usage, replaceable preview.</div>
                    <div class="mini"><b>Resources</b>Older pages, transcript export, artifact bytes, file sets, diagnostics.</div>
                    <div class="mini"><b>Action Offers</b>Only exact offered commands. Unavailable reasons shown when relevant.</div>
                    <div class="mini"><b>Operation</b>Admission/result receipt. Not the main progress surface.</div>
                    <div class="mini"><b>Headless Parity</b>Same semantic families; no TUI-only state reducers.</div>
                  </div>
                </div>
              </section>
              ${stateDump("C")}
            </div>
            ${switcher("C")}
          </section>
        `;
      }

      function render() {
        const key = currentVariantKey();
        const app = document.getElementById("app");
        const fallback = document.getElementById("fallback");
        if (fallback) fallback.style.display = "none";
        app.innerHTML =
          key === "H"
            ? workspaceHome()
            : key === "A"
              ? variantA()
              : key === "B"
                ? variantB()
                : variantC();
        document.querySelectorAll("[data-dir]").forEach((button) => {
          button.addEventListener("click", () =>
            cycle(Number(button.dataset.dir)),
          );
        });
        document.querySelectorAll("[data-view]").forEach((button) => {
          button.addEventListener("click", () => openView(button.dataset.view));
        });
        document.querySelectorAll("[data-bundle-index]").forEach((button) => {
          button.addEventListener("click", () => {
            const bundleIndex = Number(button.dataset.bundleIndex);
            launchDraft.bundleIndex = bundleIndex;
            launchDraft.harnessIndex = null;
            launchDraft.model = "";
            launchDraft.generalInstructions = "";
            launchDraft.trustApproved = false;
            render();
            document
              .querySelector(`[data-bundle-index="${bundleIndex}"]`)
              .focus();
          });
        });
        document.querySelectorAll("[data-harness-index]").forEach((button) => {
          button.addEventListener("click", () => {
            const harnessIndex = Number(button.dataset.harnessIndex);
            launchDraft.harnessIndex = harnessIndex;
            launchDraft.model = harnesses[launchDraft.harnessIndex].models[0];
            render();
            document
              .querySelector(`[data-harness-index="${harnessIndex}"]`)
              .focus();
          });
        });

        const modelSelect = document.querySelector("[data-launch-model]");
        if (modelSelect) {
          modelSelect.addEventListener("change", () => {
            launchDraft.model = modelSelect.value;
          });
        }

        const generalInstructions = document.querySelector(
          "[data-general-instructions]",
        );
        const nextButton = document.querySelector("[data-launch-next]");
        if (generalInstructions && nextButton) {
          generalInstructions.addEventListener("input", () => {
            launchDraft.generalInstructions = generalInstructions.value;
            nextButton.disabled = !generalInstructions.value.trim();
          });
        }
        if (nextButton) {
          nextButton.addEventListener("click", () => {
            if (generalInstructions) {
              launchDraft.generalInstructions = generalInstructions.value;
            }
            launchDraft.step = nextButton.dataset.launchNext;
            render();
          });
        }

        const backButton = document.querySelector("[data-launch-back]");
        if (backButton) {
          backButton.addEventListener("click", () => {
            if (backButton.dataset.launchBack === "home") {
              setVariant("H");
              return;
            }
            launchDraft.step = backButton.dataset.launchBack;
            render();
          });
        }

        const trustConfirmation = document.querySelector(
          "[data-trust-confirmation]",
        );
        if (trustConfirmation) {
          trustConfirmation.addEventListener("change", () => {
            launchDraft.trustApproved = trustConfirmation.checked;
            render();
          });
        }

        const startRunButton = document.querySelector("[data-start-run]");
        if (startRunButton) {
          startRunButton.addEventListener("click", () => {
            trustedBundleIndexes.add(launchDraft.bundleIndex);
            setVariant("B");
          });
        }
      }

      document.addEventListener("keydown", (event) => {
        const target = event.target;
        const tag =
          target && target.tagName ? target.tagName.toLowerCase() : "";
        const isEditable = target && target.isContentEditable;
        if (event.key === "Escape") {
          const backButton = document.querySelector("[data-launch-back]");
          if (backButton) {
            event.preventDefault();
            backButton.click();
          }
          return;
        }
        if (
          tag === "input" ||
          tag === "select" ||
          tag === "textarea" ||
          isEditable
        )
          return;
        if (event.key === "ArrowUp" || event.key === "ArrowDown") {
          const choices = Array.from(
            document.querySelectorAll(".choice-button"),
          );
          if (choices.length > 0) {
            event.preventDefault();
            const currentIndex = choices.indexOf(document.activeElement);
            const offset = event.key === "ArrowDown" ? 1 : -1;
            const nextIndex =
              currentIndex === -1
                ? offset === 1
                  ? 0
                  : choices.length - 1
                : (currentIndex + offset + choices.length) % choices.length;
            choices[nextIndex].focus();
          }
          return;
        }
        if (event.key === "ArrowLeft") cycle(-1);
        if (event.key === "ArrowRight") cycle(1);
      });

      render();
    </script>
  </body>
</html>
