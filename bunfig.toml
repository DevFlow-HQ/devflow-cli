# Bun test runner config (ADR 0030). The spawn trap loads first, so a real child
# reached from any later preload or test fails (tests/helpers/spawnTrap.ts).
# `@opentui/solid/preload` registers Solid's universal transform so `.tsx`
# presentation tests are reactive and the OpenTUI native renderer loads its FFI —
# the same transform `bun build --compile` gets from `@opentui/solid/bun-plugin`.
# A bare `bun test` picks this up, so the gate and a contributor's local run agree.
# Replaces the deleted Node runner + Babel loader.
[test]
preload = ["./tests/helpers/spawnTrap.ts", "@opentui/solid/preload"]
# The `test` package script (scripts/test.ts) supplies the runner settings that
# cannot live here: three isolated file workers per OS and a 30s per-test timeout.
# File isolation keeps module-level test helpers owned by one file, while the
# timeout covers Windows process creation and Bun cold-start. The launcher
# keeps three workers on every OS: the semantic suite is spawn-free (#198, and
# the spawn trap enforces it since #317), so the Bun 1.4.2 child-lifecycle
# defect that concurrent worker startup once tipped over (#149) can no longer
# fire. #274 traced Windows stalls to temp-file
# and SQLite writes on the system disk; the Windows check job routes TEMP/TMP to
# RUNNER_TEMP. This suite uses `node:test`, so the
# `[test].timeout` key applies only to `bun:test` and never reached these tests
# (#86, #89).
